[project]
name = "paperhub-cli"
version = "0.1.0"
description = "PaperHub 命令行工具"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
paperhub = "paperhub_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paperhub_cli"]
